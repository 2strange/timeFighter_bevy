<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Wordmark and tagline of the share image, kept inside the centre 630 px
       square for messengers that crop it. Orbitron from ./fonts (OFL). -->
  <defs>
    <filter id="shade" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <g font-family="Orbitron" text-anchor="middle">
    <text x="600" y="112" font-weight="800" font-size="68" letter-spacing="4" fill="#0b0a14" opacity="0.7" filter="url(#shade)">TIMEFIGHTER</text>
    <text x="600" y="112" font-weight="800" font-size="68" letter-spacing="4" fill="#ffbf33">TIME<tspan fill="#b8ffc7">FIGHTER</tspan></text>
    <g font-weight="600" font-size="25" letter-spacing="1.2">
      <text x="600" y="566" fill="#0b0a14" opacity="0.8" filter="url(#shade)">Arcade air combat over a city<tspan x="600" dy="34">in another timeline</tspan></text>
      <text x="600" y="566" fill="#f3efe6">Arcade air combat over a city<tspan x="600" dy="34">in another timeline</tspan></text>
    </g>
  </g>
</svg>
